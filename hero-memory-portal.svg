<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Inter, Poppins, 'Segoe UI', 'Noto Sans Bengali', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#021b22"/>
      <stop offset="50%" stop-color="#063440"/>
      <stop offset="100%" stop-color="#0b4f63"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="120" cy="40" r="280" fill="url(#glowA)"/>
  <circle cx="1100" cy="420" r="300" fill="url(#glowB)"/>
  <path d="M0 350 C 260 310, 460 390, 700 345 S 1050 315, 1200 355" fill="none" stroke="#5eead4" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Left: brand block -->
  <text x="72" y="110" font-size="14" font-weight="600" fill="#5eead4" letter-spacing="4">PRIVATE EVIDENCE &amp; MEMORY SYSTEM</text>
  <text x="68" y="186" font-size="72" font-weight="800" fill="url(#title)" letter-spacing="3">PARISA MEMORY</text>
  <text x="70" y="250" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="10">PORTAL</text>
  <rect x="72" y="278" width="420" height="2" fill="url(#rule)"/>
  <text x="72" y="312" font-size="20" fill="#cdeff2">মায়া কখনোই কাটানো যায় না.. এটা মৃত্যুর আগ পর্যন্ত থেকে যায়... 😘😘</text>

  <!-- Dev credit pill -->
  <rect x="72" y="338" width="330" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6"/>
  <text x="237" y="361" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle" letter-spacing="2">THIS APPS DEVELOPMENT BY DADA</text>

  <!-- Card 1: WhatsApp -->
  <g filter="url(#shadow)">
    <rect x="740" y="48" width="200" height="150" rx="22" fill="url(#card)" stroke="#5eead4" stroke-opacity="0.22"/>
  </g>
  <circle cx="782" cy="96" r="22" fill="url(#icon)"/>
  <circle cx="782" cy="96" r="8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="762" y="152" font-size="18" font-weight="700" fill="#ffffff">WhatsApp</text>
  <text x="762" y="172" font-size="12" fill="#9ee7ec">All Chats &amp; Media</text>
  <rect x="860" y="78" width="66" height="26" rx="13" fill="#ffffff" fill-opacity="0.1"/>
  <text x="893" y="96" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle">7</text>

  <!-- Card 2: Photos -->
  <g filter="url(#shadow)">
    <rect x="960" y="48" width="200" height="150" rx="22" fill="url(#card)" stroke="#5eead4" stroke-opacity="0.22"/>
  </g>
  <circle cx="1002" cy="96" r="22" fill="url(#icon)"/>
  <rect x="992" y="88" width="20" height="16" rx="3" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <circle cx="998" cy="94" r="2" fill="#ffffff"/>
  <path d="M993 102 l6 -5 l4 3 l3 -2 l4 4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="982" y="152" font-size="18" font-weight="700" fill="#ffffff">Photos</text>
  <text x="982" y="172" font-size="12" fill="#9ee7ec">Images &amp; Gallery</text>
  <rect x="1080" y="78" width="66" height="26" rx="13" fill="#ffffff" fill-opacity="0.1"/>
  <text x="1113" y="96" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle">98</text>

  <!-- Card 3: Analysis -->
  <g filter="url(#shadow)">
    <rect x="740" y="214" width="200" height="150" rx="22" fill="url(#card)" stroke="#5eead4" stroke-opacity="0.22"/>
  </g>
  <circle cx="782" cy="262" r="22" fill="url(#icon)"/>
  <rect x="772" y="262" width="4" height="10" fill="#ffffff"/>
  <rect x="779" y="256" width="4" height="16" fill="#ffffff"/>
  <rect x="786" y="259" width="4" height="13" fill="#ffffff"/>
  <text x="762" y="318" font-size="18" font-weight="700" fill="#ffffff">Analysis</text>
  <text x="762" y="338" font-size="12" fill="#9ee7ec">Chat History Analysis</text>
  <rect x="860" y="244" width="66" height="26" rx="13" fill="#ffffff" fill-opacity="0.1"/>
  <text x="893" y="262" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle">9</text>

  <!-- Card 4: Scanshot -->
  <g filter="url(#shadow)">
    <rect x="960" y="214" width="200" height="150" rx="22" fill="url(#card)" stroke="#5eead4" stroke-opacity="0.22"/>
  </g>
  <circle cx="1002" cy="262" r="22" fill="url(#icon)"/>
  <rect x="992" y="256" width="20" height="14" rx="3" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <circle cx="1002" cy="263" r="3" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="982" y="318" font-size="18" font-weight="700" fill="#ffffff">Scanshot</text>
  <text x="982" y="338" font-size="12" fill="#9ee7ec">All Screenshots</text>
  <rect x="1080" y="244" width="66" height="26" rx="13" fill="#ffffff" fill-opacity="0.1"/>
  <text x="1113" y="262" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle">693</text>
</svg>
    
